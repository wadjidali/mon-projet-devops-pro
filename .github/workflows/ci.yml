name: Pipeline CI DevOps

# Déclencheur : On lance la pipeline à chaque push ou pull-request sur la branche principale
on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  verification-et-build:
    # On demande à GitHub de nous prêter une machine virtuelle Ubuntu toute neuve
    runs-on: ubuntu-latest

    steps:
      # Étape 1 : Récupérer le code du projet sur la machine virtuelle
      - name: Récupération du code source
        uses: actions/checkout@v4

      # Étape 2 : Configurer l'environnement Python
      - name: Configuration de Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # Étape 3 : Installer les outils de vérification de code (Linter)
      - name: Installation des dépendances de test
        run: |
          python -m pip install --upgrade pip
          pip install flake8

      # Étape 4 : Analyser le code pour vérifier qu'il respecte les normes professionnelles
      - name: Analyse syntaxique du code (Linting)
        run: |
          # flake8 vérifie les fautes de frappe et la structure du code Python
          flake8 app/ --count --select=E9,F63,F7,F82 --show-source --statistics

      # Étape 5 : Tester que le Dockerfile se compile parfaitement, sans erreurs
      - name: Test de construction de l'image Docker
        run: |
          docker build -t mon-application-test:latest .